# Overrides layered on mini-swe-agent's builtin mini.yaml (harbor passes `-c mini -c <this>`).
agent:
  step_limit: 150
  cost_limit: 0
environment:
  timeout: 600
model:
  model_kwargs:
    drop_params: true
    # Qwen3.8 thinking-mode sampling (model card)
    temperature: 1.0
    top_p: 0.95
    # one reply must finish within Cloudflare's 125 s response timeout, at 8 concurrent agents
    max_tokens: 8192
    extra_body:
      top_k: 20
      min_p: 0.0
